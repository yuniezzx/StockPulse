# 超短赛道（scalp）
# 持有周期：1~3 个交易日
# 适用场景：打板复盘、强势股二次启动
# 详见 docs/screener.md §10.2

track:       scalp
description: "超短：打板复盘 + 二次启动，1~3 日持有"
top_n:       10

# Layer 2 赛道专属 Filter（按 name 引用，实现见 pulse_core/screener/filters/track/）
# Layer 1 通用 Filter 由 Runner 硬编码统一执行，不在此声明
filters:
  - min_price_filter          # 收盘价 < 3 元剔除
  - recent_active_filter      # 近 10 日有至少 1 次成交额 > 1 亿

# Layer 3 启用的 Strategy（按 name 引用，实现见 pulse_core/screener/strategies/）
strategies:
  - limit_up_replay           # 涨停复盘策略（本期示例，详见 docs/screener.md §11.4）
